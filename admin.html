<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>CaseGraph — Moderation</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#141a20;--line:#29313a;--muted:#87919d;--text:#edf2f7;--accent:#a6f36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#202c34 0,transparent 55%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:38px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.top a{color:var(--accent);text-decoration:none}.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,textarea{background:#090d11;border:1px solid var(--line);border-radius:7px;padding:11px;color:var(--text);font:inherit}input{flex:1;min-width:230px}button{border:1px solid var(--line);border-radius:7px;padding:10px 14px;background:#202a32;color:var(--text);cursor:pointer;font:inherit}button.ok{background:var(--accent);border-color:var(--accent);color:#10150c;font-weight:800}button.no{border-color:#a84e4e;color:#ffaaaa}.muted{color:var(--muted);font-size:12px}.item h3{margin:0}.item pre{white-space:pre-wrap;overflow:auto;max-height:260px;background:#090d11;padding:12px;border-radius:8px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;color:var(--accent)}
</style></head><body><main><div class="top"><div><b>CASEGRAPH / MODERATION</b><div class="muted">Проверка конфигов перед публикацией</div></div><a href="catalog.html">← Каталог</a></div>
<section class="panel"><p>Введи адрес развернутого Worker и секрет модератора. Секрет хранится только в памяти этой вкладки и не записывается в репозиторий.</p><div class="row"><input id="api" placeholder="https://casegraph-api.ТВОЙ-SUBDOMAIN.workers.dev"><input id="token" type="password" placeholder="ADMIN_TOKEN"></div><div class="row" style="margin-top:10px"><button class="ok" id="load">Загрузить заявки</button><button id="clear">Очистить поля</button></div><p class="status" id="status"></p></section>
<section id="queue"></section></main>
<script>
const $=s=>document.querySelector(s);let items=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(path,body){const base=$("#api").value.trim().replace(/\/$/,"");if(!base)throw Error("Укажи URL Worker");const r=await fetch(base+path,{method:body?"POST":"GET",headers:{"content-type":"application/json","authorization":"Bearer "+$("#token").value.trim()},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||("HTTP "+r.status));return j}
function render(){const root=$("#queue");root.innerHTML=items.length?items.map(x=>'<article class="item"><div class="row" style="justify-content:space-between"><div><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.type)+' · '+esc(x.author)+' · '+esc(x.created)+'</div></div><span class="muted">PENDING</span></div><pre>'+esc(JSON.stringify(x.data,null,2))+'</pre><div class="actions"><button class="ok" data-action="approve" data-id="'+esc(x.id)+'">Одобрить и опубликовать</button><button class="no" data-action="reject" data-id="'+esc(x.id)+'">Отклонить</button></div></article>').join(""):'<div class="panel muted">Очередь пуста. Новых заявок нет.</div>'}
$("#load").onclick=async()=>{try{const r=await call("/api/admin/submissions");items=r.submissions||[];render();$("#status").textContent="Заявок в очереди: "+items.length}catch(e){$("#status").textContent="Ошибка: "+e.message}};
$("#clear").onclick=()=>{$("#token").value="";$("#api").value="";$("#queue").innerHTML="";$("#status").textContent=""};
$("#queue").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;b.disabled=true;try{await call("/api/admin/moderate",{id:b.dataset.id,action:b.dataset.action});items=items.filter(x=>x.id!==b.dataset.id);render();$("#status").textContent=b.dataset.action==="approve"?"Конфиг одобрен и опубликован.":"Заявка отклонена."}catch(err){b.disabled=false;$("#status").textContent="Ошибка: "+err.message}});
</script></body></html>
